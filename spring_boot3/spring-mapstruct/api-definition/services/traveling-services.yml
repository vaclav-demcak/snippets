info: { title: "<FRAGMENT>", version: "<FRAGMENT>" }

tags:
  - name: TravelingServices
    description: Base Application info REST service

paths:
  /init:
    post:
      tags:
        - TravelingServices
      summary: Initiate an upload session
      operationId: initiateSession
      responses:
        200:
          description: Upload session initiated
          content:
            application/json:
              schema:
                $ref: '../components/traveling-components.yml#/components/schemas/InitUploadSession'
#                type: object
#                properties:
#                  session_id:
#                    type: string
#                    description: The unique ID for the upload session
        400:
          $ref: '../components/app-components-common.yml#/components/responses/400_BadRequestError'

  /upload:
    post:
      tags:
        - TravelingServices
      summary: Upload a file chunk
      operationId: uploadFile
      parameters:
        - name: x-session-id
          in: header
          required: true
          schema:
            type: string
            description: The unique session ID for associating the chunk
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  format: binary
#          application/octet-stream:
#            schema:
#              type: string
#              format: binary
      responses:
        200:
          description: Chunk uploaded successfully
        400:
          $ref: '../components/app-components-common.yml#/components/responses/400_BadRequestError'

  /finalize:
    post:
      tags:
        - TravelingServices
      summary: Finalize the upload session
      operationId: finalizeUpload
      parameters:
        - name: x-session-id
          in: header
          required: true
          schema:
            type: string
          description: The unique session ID for finalizing the upload
      responses:
        200:
          description: Upload finalized successfully
        400:
          $ref: '../components/app-components-common.yml#/components/responses/400_BadRequestError'
